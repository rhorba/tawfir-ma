services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tawfir
      POSTGRES_USER: ${DATABASE_USER:-tawfir}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-tawfir_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - tawfir_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-tawfir}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tawfir
      DATABASE_USER: ${DATABASE_USER:-tawfir}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-tawfir_dev_password}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-change-me-before-any-shared-environment}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      OTP_PROVIDER: ${OTP_PROVIDER:-mock}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      CMI_PROVIDER: ${CMI_PROVIDER:-mock}
      CMI_WEBHOOK_SECRET: ${CMI_WEBHOOK_SECRET:-mock-webhook-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-dev-only-change-me-before-any-shared-environment}
    depends_on:
      postgres:
        condition: service_healthy

  frontend-member:
    build: ./frontend-member
    ports:
      - "3000:80"
    depends_on:
      - backend

  frontend-admin:
    build: ./frontend-admin
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  tawfir_postgres_data:
