name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, test, coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Lint (Checkstyle)
        run: ./mvnw -B checkstyle:check
      - name: Test + coverage gate + package
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

  frontend-member:
    name: Frontend Member (lint, test, coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-member
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-member/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Test + coverage gate
        run: npm run test:coverage
      - name: Build
        run: npm run build

  frontend-admin:
    name: Frontend Admin (lint, test, coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Test + coverage gate
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build

  security-scan:
    name: Security scan (SAST, SCA, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
        continue-on-error: false
      - name: Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan (SCA)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend-member, frontend-admin, security-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t tawfir-api:ci ./backend
      - name: Build frontend-member image
        run: docker build -t tawfir-frontend-member:ci ./frontend-member
      - name: Build frontend-admin image
        run: docker build -t tawfir-frontend-admin:ci ./frontend-admin
