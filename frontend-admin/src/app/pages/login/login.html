<main class="login-page">
  <div class="login-card">
    <h1>Tawfir Admin</h1>

    @if (step() === 'phone') {
      <form (ngSubmit)="requestOtp()" #phoneForm="ngForm">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Phone number</mat-label>
          <input matInput type="tel" name="phoneNumber" required [(ngModel)]="phoneNumber" placeholder="+212 6XX XXX XXX" />
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="phoneForm.invalid">
          Send code
        </button>
      </form>
    } @else {
      <form (ngSubmit)="verifyOtp()" #otpForm="ngForm">
        <p>Enter the code sent to {{ phoneNumber }}</p>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Code</mat-label>
          <input matInput type="text" inputmode="numeric" name="code" required [(ngModel)]="code" />
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="otpForm.invalid">
          Verify
        </button>
      </form>
    }
  </div>
</main>
